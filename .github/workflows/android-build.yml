name: Build Android APK & OTA

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'public/**'
      - 'design-system/**'
      - 'fami-version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Core Unit Tests
        run: ./gradlew testDebugUnitTest --tests "com.example.MainActivityLaunchTest" --tests "com.example.CountryCurrencyConfigTest" --tests "com.example.OtaUpdateManagerTest" --tests "com.example.TaskNotificationHelperTest" --tests "com.example.FamiStringsLocalizationTest" --tests "com.example.LocalCryptoBoxTest" --tests "com.example.GeminiParserTest" --tests "com.example.ExampleUnitTest" --no-daemon

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fami-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fami-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release & Update OTA Manifest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n1 | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="Fami_v${VERSION_NAME}.apk"
          cp "$APK_SRC" "$APK_NAME"
          APK_SHA256=$(sha256sum "$APK_NAME" | awk '{print toupper($1)}')
          TAG="v${VERSION_NAME}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "Fami ${TAG} (Build ${VERSION_CODE})" \
              --notes "Actualización oficial de Fami ${TAG} (Build ${VERSION_CODE}). Nuevo Tema Oscuro Papel Grafito Cálido, consentimiento legal en registro/unión, centro de permisos del dispositivo, perfiles con roles/badges, compartir invitación por código y afiliación a otro hogar desde Ajustes."
          fi

          python3 - <<PY
          import json
          data = {
              "packageName": "app.somosfami",
              "latestVersionCode": int("${VERSION_CODE}"),
              "latestVersionName": "${VERSION_NAME}",
              "latestApkUrl": "${APK_URL}",
              "apkSha256": "${APK_SHA256}",
              "changelog": "v${VERSION_NAME} (Build ${VERSION_CODE}): Nuevo Modo Oscuro Papel Grafito Cálido, perfiles y roles completos, compartir invitación familiar, unirse a otro hogar desde Ajustes, centro de permisos y consentimiento legal en registro."
          }
          with open("fami-version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet fami-version.json; then
            git add fami-version.json
            git commit -m "chore(ota): update fami-version.json to ${TAG} (${VERSION_CODE}) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
